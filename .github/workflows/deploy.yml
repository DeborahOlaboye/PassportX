name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install passportx-sdk (Force npmjs.com)
        run: |
          npm install passportx-sdk --registry=https://registry.npmjs.org/ --no-userconfig

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present
